id = "yeutterg.herdr-overseer"
name = "Herdr Overseer"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Status-first sidebar: tab title, live activity and the PRs/issues each agent is working on, tabs nested under their space, and the session name in the window title."
platforms = ["linux", "macos"]

# No daemon. Herdr has no supervised long-running plugin process, so every
# refresh is a short-lived command fired by a startup or event hook. The live
# activity lines are kept current by bin/live.js, run from a tab-bar status
# command that Configure installs (Herdr re-runs those on an interval).

[[startup]]
command = ["node", "bin/refresh.js"]

# Anything that changes an agent's state or the set of tabs repaints tokens.
[[events]]
on = "pane.agent_status_changed"
command = ["node", "bin/refresh.js"]

[[events]]
on = "pane.agent_detected"
command = ["node", "bin/refresh.js"]

[[events]]
on = "tab.created"
command = ["node", "bin/refresh.js"]

[[events]]
on = "tab.closed"
command = ["node", "bin/refresh.js"]

[[events]]
on = "tab.renamed"
command = ["node", "bin/refresh.js"]

[[events]]
on = "pane.closed"
command = ["node", "bin/refresh.js"]

# Selection changes re-render the selected agent (wrapped activity, branch,
# PRs) and the window title. Kept separate from refresh.js so a click
# responds immediately.
[[events]]
on = "workspace.focused"
command = ["node", "bin/live.js"]

[[events]]
on = "tab.focused"
command = ["node", "bin/live.js"]

[[events]]
on = "pane.focused"
command = ["node", "bin/live.js"]

[[events]]
on = "workspace.renamed"
command = ["node", "bin/live.js"]

# Reordering tabs or spaces re-sorts the Spaces tab list and the panel.
[[events]]
on = "tab.moved"
command = ["node", "bin/live.js"]

[[events]]
on = "workspace.moved"
command = ["node", "bin/live.js"]

[[actions]]
id = "configure"
title = "Configure: install the sidebar layout"
description = "Write (or repair) the managed sidebar block in Herdr's config.toml and reload every running session."
command = ["node", "bin/configure.js", "--apply"]

[[actions]]
id = "unconfigure"
title = "Configure: remove the sidebar layout"
description = "Remove the managed block, clear this plugin's tokens and window title, and reload. Do this before uninstalling."
command = ["node", "bin/configure.js", "--remove"]

[[actions]]
id = "refresh"
title = "Refresh now"
description = "Re-read every pane in every running session, bypass the PR cache and repaint."
command = ["node", "bin/configure.js", "--refresh"]

# Agent overview: a TUI tab per space (see bin/overview.js). Turn off with
# "overview": false in the plugin's config.json.
[[actions]]
id = "overview"
title = "Overview: open for this space"
description = "Open (or focus) an overview tab listing this space's agents: status, activity, branch, PRs/issues and your notes."
command = ["node", "bin/open-overview.js"]

[[actions]]
id = "overview-all"
title = "Overview: open in every space"
description = "Add an overview tab to every space in this session that does not have one, without moving you."
command = ["node", "bin/open-overview.js", "--all"]

[[panes]]
id = "overview"
title = "Agent overview"
placement = "tab"
command = ["node", "bin/overview.js"]
